<h2 mat-dialog-title>Delete Application</h2>
<mat-dialog-content class="dialog-message">
    Are you sure you want to delete this application?
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button color="secondary" (click)="onCancel()">CANCEL</button>
    <button mat-button color="primary" (click)="onConfirm()">
        CONFIRM
    </button>
</mat-dialog-actions>
